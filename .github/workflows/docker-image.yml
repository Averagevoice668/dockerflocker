name: Docker Image CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:

  code-quality:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: '**/*.csproj'
      

    - name: Verify code formatting
      run: dotnet format --verify-no-changes --severity warn

    - name: Static code analysis
      run: dotnet build --configuration Release /warnaserror

  compile-and-build:
    name: Docker Build & Package
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: '**/*.csproj'
    
    - name: Build Application Constrainers
      run: docker compose build

  intergration-testing:
    name: System Integration Verification
    runs-on: ubuntu-latest
    needs: compile-and-build
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: '**/*.csproj'
    
    - name: Build and Launch Application Mesh
      run: docker compose up --build -d

    - name: Grace Period for Database Boot
      run: |
        echo "Giving Mircosoft SQL Server 25 seconds to complete table setup..."
        sleep 25
    
    - name: Wait for API Readiness
      run: |
        echo "Waiting for ChickenAPI to wake up at http://localhost:8080..."
        timeout 60s sh -c 'until curl -sSf http://localhost:8080/GetMeEggs > /dev/null; do sleep 2; done'
        echo "ChickenAPI is up and running!"

    - name: Integration Step 1 - Seed Data via API
      run: |
        echo "Posting a new chicken payload to the database..."
        curl -X POST http://localhost:8080/api/Chicken \
          -H "Content-Type: application/json" \
          -d '{"name": "Clucky", "age": 2, "breed": "Rhode Island Red"}'
          --fail --verbose

    - name: Integration Step 2 - Verify Front-End MVC Data Rendering
      run: |
        echo "Querying the MVC web application home page on port 80..."
        MVC_RESPONSE=$(curl -s http://localhost:80/)

        echo "Asserting that the front-end view successfully displays the dynamic API string context..."
        if echo "$MVC_RESPONSE" | grep -q "Clucky"; then
          echo "Success: The MVC view correctly rendered the API data context."
        else
          echo "Failure: The MVC view did not render the expected API data context."
          exit 1
        fi
      
    - name: Tear Down Mesh and Logs
      if: always()
      run: |
        docker compose logs api-service > api-container-debug.log
        docker compose logs chick-db-service > db-container-debug.log
        docker compose logs mvc-service > mvc-container-debug.log
        docker compose down --volumes

  cd-deployment:
      name: Production Cloud Deployment
      runs-on: ubuntu-latest
      needs: intergration-testing
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      environment: Production
      steps:
      - name: Execute Server Infrastructure Sync
        run: |
          echo "All automated test passed..."